name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-application:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Configure JWT Secret
        run: |
          az webapp config appsettings set \
            --name user \
            --resource-group xshopai \
            --settings JWT_SECRET="${{ secrets.JWT_SECRET }}"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: user
          package: .

      - name: Restart App Service
        run: |
          az webapp restart \
            --name user \
            --resource-group xshopai

      - name: Health Check
        run: |
          echo "Waiting for service to start..."
          sleep 30
          
          HEALTH_URL="https://user.azurewebsites.net/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
          
          if [ $RESPONSE -eq 200 ]; then
            echo "✅ Health check passed!"
            echo "### Deployment Successful! 🎉" >> $GITHUB_STEP_SUMMARY
            echo "**Service URL:** https://user.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
            echo "**Health Status:** Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed with status $RESPONSE"
            echo "### Deployment Warning ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "**Service URL:** https://user.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
            echo "**Health Status:** Unhealthy (HTTP $RESPONSE)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Azure Logout
        if: always()
        run: az logout
