name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
  push:
    branches:
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Create Resource Group
        run: |
          az group create \
            --name rg-xshopai \
            --location uksouth

      - name: Deploy Bicep Template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-xshopai
          template: ./infra/bicep/main.bicep
          parameters: ./infra/bicep/parameters.${{ github.event.inputs.environment || 'dev' }}.json
          failOnStdErr: false

      - name: Get Deployment Outputs
        id: outputs
        run: |
          APP_URL=$(az deployment group show \
            --resource-group rg-xshopai \
            --name main \
            --query properties.outputs.appServiceUrl.value -o tsv)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "### Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**App Service URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
